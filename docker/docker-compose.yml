# Airflow local development setup — LocalExecutor + PostgreSQL metadata DB
#
# Usage:
#   cp .env.example .env          # fill in values
#   docker compose up airflow-init  # first run only — initializes DB and creates admin user
#   docker compose up -d            # start webserver + scheduler
#   open http://localhost:8080      # admin / admin
#   docker compose down             # stop
#
# The project directory is mounted at /opt/epi-pipeline inside both containers.
# BashOperator tasks call Rscript and dbt on the HOST via the mount — R, dbt,
# and DB credentials must be installed/configured on the host, not inside the image.
#
# Airflow's own metadata (run history, task state) lives in the postgres container
# below — completely separate from the epi_pipeline RDS database.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-in-production"
    # Pass through so BashOperator subprocesses can reach the epi_pipeline DB
    DB_PASSWORD_EPI: "${DB_PASSWORD_EPI}"
  volumes:
    # DAG definitions
    - ./dags:/opt/airflow/dags
    # Project root — BashOperator paths reference this mount
    - ..:/opt/epi-pipeline
    # Persist Airflow logs between restarts
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
